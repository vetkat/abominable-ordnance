ao-larva-launcher-speed=Larva launcher fire rate
ao-larva-launcher-range=Larva launcher range
ao-stasis-ward=Stasis ward

[technology-description]
ao-monster-husbandry=Breed biters and spitters from eggs. Native nests drop eggs when you destroy them.
ao-ordnance-loading=Load larvae with explosive rockets, sulfuric acid or poison capsules, in a larva rocket casing. A larva rocket that spoils hatches a monster that fights the natives and sets off its payload when it dies.
ao-larva-rockets=Fire larva rockets from the larva launcher. A rocket lands with a small blast, and its loaded monster attacks the natives near it.
ao-larva-launcher-speed=Larva launchers fire faster.
ao-larva-launcher-range=Larva launchers reach further. Placed launchers update when the research finishes.
ao-stasis-ward=Pack eggs, larvae and larva rockets with a stasis ward, so they spoil 20 times more slowly. When you unpack an item, you get the ward back. A warded item that spoils still hatches, and its ward is lost.

[item-description]
ao-larva-launcher=Fires larva rockets at native nests and worms in range, and at spots that you mark with the larva targeting remote. Larva rockets still spoil in the launcher.
ao-larva-targeting-remote=Marks a target for larva launchers in range.
ao-stasis-ward=Packs one egg, larva or larva rocket so that it spoils 20 times more slowly. The item keeps its spoil progress when you pack and unpack it.

