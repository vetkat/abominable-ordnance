[entity-description]
cma-diesel-generator=Burns chemical fuel in a V-engine to spin a flywheel generator.
cma-field-emitter-mk1=A rotating coil projects the effect of its module across the surrounding machines.
cma-field-emitter-mk2=Twin emitter horns and a counter-rotating node ring push the field further.
cma-field-emitter-mk3=Gyro-stabilised triple emitter. The hum can be felt through your boots.
cma-kinetic-turbine-mk1=A split-casing industrial turbine. Hot steam in one end, megawatts out the other.
cma-kinetic-turbine-mk2=Sealed nacelle, magnetic bearings and an appetite for steam.
cma-kinetic-turbine-mk3=The rotor floats in its stator cage, glowing. Nobody is quite sure it still needs the steam.
cma-process-reactor-mk1=A riveted, steam-jacketed vat with an agitator that never quite stops squeaking.
cma-process-reactor-mk2=Twin glass columns and a centrifugal separator. Whatever it is, it is getting purer.
cma-process-reactor-mk3=The reagents hang in mid-air, held by fields nobody wants to switch off to inspect.
cma-industrial-press-mk1=A flywheel, a crank and a great deal of confidence. Keep fingers clear.
cma-industrial-press-mk2=Hydraulic press with a robotic feed arm that has never once missed the die.
cma-industrial-press-mk3=The forming head floats on fields. It still makes the same satisfying thunk.
cma-arc-smelter-mk1=Brick, coal, bellows and patience. The oldest trick in metallurgy still works.
cma-arc-smelter-mk2=Three graphite electrodes, one very bad mood. Wear the dark glasses.
cma-arc-smelter-mk3=The melt never touches the crucible. Nothing to contaminate it; nothing to wear out.
cma-deep-extractor-mk1=A lattice derrick, a winch and a drill string that hammers its way down.
cma-deep-extractor-mk2=Sealed bore head with a coolant jacket. Goes deeper, complains less.
cma-deep-extractor-mk3=Three emitters focus a beam into the ground. What comes back up is already loosened.
cma-pressure-tank-mk1=Riveted, banded and only slightly weeping at the seams.
cma-pressure-tank-mk2=A pressure sphere on braced columns. Rated for a lot more than you will put in it.
cma-pressure-tank-mk3=Vacuum-jacketed dewar. The frost on the vent is normal. Probably.
cma-research-array-mk1=A centrifuge, a microscope and a bench full of things that should be labelled.
cma-research-array-mk2=Analyser rings spin under a glass dome while the scanner arm takes notes.
cma-research-array-mk3=The sample floats where it can be studied from every side at once.
cma-capacitor-bank-mk1=Four Leyden jars the size of barrels. Do not lick the brass balls.
cma-capacitor-bank-mk2=Sealed industrial cells with ceramic bushings and a cooling fan that never stops.
cma-capacitor-bank-mk3=Energy stored in the lattice of a single grown crystal. It hums in a minor key.
cma-crusher-mk1=A jaw crusher. Rock goes in the top, gravel comes out the front, noise goes everywhere.
cma-crusher-mk2=Twin toothed rolls. Anything that fits through the nip comes out smaller.
cma-crusher-mk3=A grinding disc spun up past the point where the teeth start to glow.
cma-coal-kiln-mk1=A bottle kiln. Stack it, light it, wait, and do not open the door early.
cma-coal-kiln-mk2=Barrel-vaulted brick kiln held together with iron buckstays and good intentions.
cma-coal-kiln-mk3=Steel-cased and blower-fed. Still burns coal, but now it has opinions about airflow.
cma-logistics-hub-mk1=A depot with a roof hatch, four charging posts and an antenna you could hang laundry on.
cma-logistics-hub-mk2=Industrial robot hub with a tracking dish. Keeps the swarm fed and charged.
cma-logistics-hub-mk3=A dark nexus with glowing seams. The robots seem to like it better here.
cma-pump-station-mk1=Cast-iron volute pump. Bolted down twice, because it tried to walk off once.
cma-pump-station-mk2=Canned inline pump: no seals to leak, one fan to rattle.
cma-pump-station-mk3=Magnetic drive. The rotor never touches anything; the fluid barely notices it is being moved.
cma-signal-mast-mk1=A lattice tower turning a bedspring antenna. It hears more than it should.
cma-signal-mast-mk2=A tracking dish on a turret pedestal. Always looking somewhere else.
cma-signal-mast-mk3=Phased-array panel. It turns anyway, out of habit.
cma-inline-processor-mk1=Three stamping heads on one line shaft. In one end, out the other.
cma-inline-processor-mk2=An enclosed process tunnel with a gantry that never stops shuttling.
cma-inline-processor-mk3=Parts drift down a glowing conduit and come out finished. Nobody touches them.
cma-steam-boiler-mk1=A riveted fire-tube boiler. The safety valve pops just often enough to be reassuring.
cma-steam-boiler-mk2=Cased water-tube boiler with a forced-draught fan. Raises steam in a hurry.
cma-steam-boiler-mk3=A plasma core in a coolant coil. Water goes in, superheated steam comes out, no fire required.
cma-crane-inserter-mk1=A riveted girder arm with a claw. Slow, sure, and very loud.
cma-crane-inserter-mk2=Hydraulic arm, two items per swing. The piston hisses with every pick.
cma-crane-inserter-mk3=Field-gripper arm: the fingers glow when they hold something.
cma-tesseract-compressor-mk1=A lab rig holding a four-dimensional cube in place with four coil emitters and a great deal of cable. Items go in. Fewer dimensions come out.
cma-tesseract-compressor-mk2=Production model. The correction ring never quite stops turning, and nobody has asked why.
cma-tesseract-compressor-mk3=The hypercube turns inside out on schedule. The machine around it has mostly stopped needing to try.
cma-singularity-press-mk1=Four hydraulic clamps and a lot of hope, holding a hole in the world over a pit. Matter goes in. It comes out denser.
cma-singularity-press-mk2=Armoured clamp towers take turns pushing on nothing at all. The accretion disc is the only part that moves willingly.
cma-singularity-press-mk3=The clamps no longer touch the ground. Neither, strictly speaking, does anything near the middle.
cma-armillary-stabilizer-mk1=Three riveted gimbal rings, spring dampers, and one point of light that must not move. So far it hasn't.
cma-armillary-stabilizer-mk2=The bearing towers hum. The rings correct, and correct, and correct. The mote stays exactly where it is.
cma-armillary-stabilizer-mk3=No stand, no bearings, nothing touching. The rings keep turning anyway, just in case.
cma-containment-torus-mk1=A ring of copper and hope with something very hot running laps inside it. Plug heat pipes into any side.
cma-containment-torus-mk2=Production torus. The windows are rated for what's inside, mostly.
cma-containment-torus-mk3=The coils float, the plasma runs violet, and the heat comes out at any temperature you like.
cma-matter-printer-mk1=A sheet of light climbs through a ghost of the product, and leaves the real thing behind.
cma-matter-printer-mk2=Production printer. The hologram is the drawing; the light sheet is the pen.
cma-matter-printer-mk3=No rails, no carriage. The light sheet knows where to go.
cma-rift-tap-mk1=Two pylons hold a tear in the world open. Ore falls out of it. Nobody has volunteered to look inside.
cma-rift-tap-mk2=Armoured pylons keep the rift steady enough for a production schedule.
cma-rift-tap-mk3=Anchor rings hold the rift wide open. It no longer seems to mind.
cma-orbital-receiver-mk1=A wire-mesh dish catching a beam from something in orbit. Do not stand in the beam.
cma-orbital-receiver-mk2=A solid dish with a cooled receiver. The beam is steadier, the power is too.
cma-orbital-receiver-mk3=The dish barely needs to be there. The beam finds the crystal regardless.
cma-neural-vat-mk1=A glass jar of something dark with something bright growing in it. The pulses get faster when it's working.
cma-neural-vat-mk2=Armoured, jacketed, wired into the data trunks. It's thinking about your recipe.
cma-neural-vat-mk3=The glass is held by light now. The tree inside has grown to fill it.
