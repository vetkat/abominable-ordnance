[mod-setting-name]
cma-graphics-showcase=Showcase machines

[mod-setting-description]
cma-graphics-showcase=Adds working example machines (free recipes in their own crafting tab) so you can try the assets in-game. Off by default: with it off the mod only provides the graphics library for other mods.

